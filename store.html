<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可销售商品</title>
    <!-- 引入 Tailwind CSS 实现快速美工 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">📚 书屋</h1>
            <span class="text-sm text-gray-500">官方指定销售页面</span>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
        <!-- 页面标题 -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">精选好书</h2>
            <p class="text-gray-500">点击下方按钮，通过 PayPal 安全支付</p>
        </div>

        <!-- 书籍展示区域（可以复制多份展示多本书） -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- 第一本书 -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                <!-- 书籍封面图（替换为你自己的图片链接，建议传到 GitHub 或者用图床） -->
                <img src="https://wudeshijie.being.net.cn/book-cover.pngp" alt="书籍封面" class="w-full h-64 object-cover">
                <div class="p-6 flex-grow flex flex-col">
                    <h3 class="text-xl font-bold mb-1">书名：《生-成》</h3>
                    <p class="text-gray-500 text-sm mb-4">作者：汤利军</p>
                    <p class="text-gray-600 text-sm mb-6 flex-grow">这是一本关于个人品牌和副业变现的深度指南，适合所有想在互联网上建立影响力的创作者。</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">¥ 99.00</span>
                        <!-- 把下方的 href="#" 替换成你稍后在 PayPal 生成的支付链接 -->
                        <a href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-md">
                            立即购买
                        </a>
                    </div>
                </div>
            </div>

            <!-- 第二本书（如果只有一本，可以删掉这一整块） -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                <img src="https://images.unsplash.com/photo-1589829085413-56de8ae18c73?q=80&w=800&auto=format&fit=crop" alt="书籍封面" class="w-full h-64 object-cover">
                <div class="p-6 flex-grow flex flex-col">
                    <h3 class="text-xl font-bold mb-1">书名示例：《从0到1做独立开发者》</h3>
                    <p class="text-gray-500 text-sm mb-4">作者：汤利军</p>
                    <p class="text-gray-600 text-sm mb-6 flex-grow">手把手教你如何利用业余时间开发产品并赚取第一桶金，包含完整的技术栈与商业模式解析。</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">¥ 129.00</span>
                        <a href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-md">
                            立即购买
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t py-6 mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center text-gray-400 text-sm">
            <p>© 2026 汤利军. 保留所有权利。</p>
            <p class="mt-1">如有疑问，请联系：你的邮箱@example.com</p>
        </div>
    </footer>

</body>
</html>
