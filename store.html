<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可销售商品</title>
    <!-- 引入 Tailwind CSS 实现快速美工 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">📚 吾的书屋</h1>
            <span class="text-sm text-gray-500">官方指定销售页面</span>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
        <!-- 页面标题 -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">精选好书</h2>
        </div>

        <!-- 书籍展示区域 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- 第一本书《生-成》（按钮置灰，PayPal暂未开通） -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                <img src="https://wudeshijie.being.net.cn/book-cover.png" alt="《生-成》封面" class="w-full h-64 object-cover">
                <div class="p-6 flex-grow flex flex-col">
                    <h3 class="text-xl font-bold mb-1">《生-成》</h3>
                    <p class="text-gray-500 text-sm mb-4">作者：汤利军</p>
                    <p class="text-gray-600 text-sm mb-6 flex-grow">这是一本关于如何在“无限不确定性背景中持续生成有限确定性”的书。阅读《生-成》，生成全新的自己！</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">HKD 199.00</span>
                        <!-- 按钮置灰，不可点击 -->
                        <span class="bg-gray-400 text-white font-bold py-2 px-6 rounded-lg shadow-md cursor-not-allowed">
                            立即购买
                        </span>
                    </div>
                    <p class="text-xs text-gray-400 mt-2 text-right">支付暂未开通，敬请期待，提前阅读请联系作者。</p>
                </div>
            </div>
            
            <!-- 第二本书《思想是如何生成的? 中国思想卷》（亚马逊购买链接） -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                <img src="https://wudeshijie.being.net.cn/thought-china-cover.jpg" alt="《思想是如何生成的? 中国思想卷》封面" class="w-full h-64 object-cover">
                <div class="p-6 flex-grow flex flex-col">
                    <h3 class="text-xl font-bold mb-1">《思想是如何生成的? 中国思想卷》</h3>
                    <p class="text-gray-500 text-sm mb-4">作者：汤利军</p>
                    <p class="text-gray-600 text-sm mb-6 flex-grow">从传统到现代，一部中国思想的生成史。从天道到人道，思想如何在现实中生成，又如何塑造中国的过去、现在与未来？</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-600">USD 2.99</span>
                        <a href="https://www.amazon.com/dp/B0HKFS58QD" target="_blank" rel="noopener" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-md">
                            立即购买
                        </a>
                    </div>
                    <p class="text-xs text-gray-400 mt-2 text-right">注意：这是亚马逊销售的电子书。</p>
                </div>
            </div>

        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t py-6 mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center text-gray-400 text-sm">
            <p>© 2026 保留所有权利。</p>
            <p class="mt-1">如有疑问，请联系：tang@being.net.cn</p>
        </div>
    </footer>

</body>
</html>
